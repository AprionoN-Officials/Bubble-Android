name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v1.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platforms
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if configured)
        id: signing
        env:
          BUBBLE_KEYSTORE_BASE64: ${{ secrets.BUBBLE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$BUBBLE_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$BUBBLE_KEYSTORE_BASE64" | base64 --decode > keystore/bubble-release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No BUBBLE_KEYSTORE_BASE64 secret found; building unsigned release APKs."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests and build release APKs
        env:
          BUBBLE_KEYSTORE_PASSWORD: ${{ secrets.BUBBLE_KEYSTORE_PASSWORD }}
          BUBBLE_KEY_ALIAS: ${{ secrets.BUBBLE_KEY_ALIAS }}
          BUBBLE_KEY_PASSWORD: ${{ secrets.BUBBLE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon

      - name: Package release assets and checksums
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          OUT="release-assets"
          mkdir -p "$OUT"
          for apk in app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk")"
            # Extract ABI from app-<abi>-release*.apk
            abi="$(echo "$base" | sed -E 's/^app-([a-z0-9_-]+)-release.*\.apk$/\1/')"
            cp "$apk" "$OUT/Bubble-${TAG}-${abi}.apk"
          done
          (cd "$OUT" && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh "$OUT"

      - name: Clean up decoded keystore
        if: always()
        run: rm -rf keystore/bubble-release.jks

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VER="${TAG#v}"
          PRERELEASE_FLAG=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Extract matching section from CHANGELOG.md if present; otherwise fall back to GitHub auto notes
          NOTES_FILE="release-notes.md"
          awk -v tag="$TAG" -v ver="$VER" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" tag "\\]" || $0 ~ "^## \\[" ver "\\]") {
                found=1
                next
              }
            }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE" 2>/dev/null || true

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          elif [ -s "$NOTES_FILE" ]; then
            gh release create "$TAG" release-assets/* \
              --title "Bubble ${TAG}" \
              --notes-file "$NOTES_FILE" \
              $PRERELEASE_FLAG
          else
            gh release create "$TAG" release-assets/* \
              --title "Bubble ${TAG}" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
