name: "💡 Feature Request"
description: Suggest a new feature or improvement for Bubble.
title: "[Feature]: "
labels: ["type: feature", "status: under review"]

body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Bubble better?
        We would love to hear your suggestions!

        Please note that Bubble is still under active development.
        Suggested features are not guaranteed to be implemented.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have checked for similar feature requests.
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - Screen Translation
        - Search with Image
        - Text Selection / OCR
        - QR Code Scanner
        - Customization
        - User Interface / UX
        - Accessibility
        - Performance
        - Privacy and Security
        - New Feature
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Feature
      description: Describe the feature you would like to see.
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use Case
      description: How would you use this feature in Bubble?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions.

  - type: textarea
    id: references
    attributes:
      label: Screenshots, Mockups or References
      description: Attach visual examples or reference links.

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Anything else you would like to share.
